name: Release APK

# CD — dipicu oleh tag versi (mis. `git tag v1.0.0 && git push origin v1.0.0`).
# Version Flutter/Java sengaja SAMA dengan ci.yml: jangan di-upgrade tanpa
# upgrade lokal (lihat komentar di workflow CI).

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag rilis (mis. v1.0.0)'
        required: true

jobs:
  release:
    name: Build & Publish APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter 3.47.5
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.5'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Test (gate sebelum rilis)
        run: flutter test

      - name: Build release APKs (Universal & Split ABI)
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: GitHub Release dengan APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: build/app/outputs/flutter-apk/*.apk
          generate_release_notes: true
